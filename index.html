    <!-- Dados estruturados: aplicação web -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Simulador de Licença Parental",
      "url": "https://minhalicenca.pt/",
      "description": "Simulador gratuito que calcula os dias de licença parental da mãe e do pai em Portugal e mostra o calendário completo da ausência ao trabalho.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All",
      "inLanguage": "pt-PT",
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
    }
    </script>

    <!-- Dados estruturados: FAQ (pode aparecer em destaque no Google) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Quantos dias de licença parental tem a mãe?",
          "acceptedAnswer": { "@type": "Answer", "text": "A licença parental inicial da mãe é de 120 ou 150 dias (cerca de 4 a 5 meses). Com a partilha entre mãe e pai, o período pode chegar a 180 dias. A escolha entre 120 e 150 dias altera a percentagem do salário recebida." }
        },
        {
          "@type": "Question",
          "name": "Quantos dias de licença tem o pai?",
          "acceptedAnswer": { "@type": "Answer", "text": "O pai tem 28 dias obrigatórios mais 7 dias facultativos, num total de até 35 dias de licença exclusiva, pagos a 100%. Pode ainda gozar dias adicionais através da licença parental partilhada." }
        },
        {
          "@type": "Question",
          "name": "O que é a licença parental partilhada e quantos dias acrescenta?",
          "acceptedAnswer": { "@type": "Answer", "text": "É quando a mãe e o pai dividem a licença inicial. Permite aumentar o total para 180 dias, desde que o pai goze um número mínimo de dias em exclusivo. Em troca, a percentagem do subsídio é mais elevada." }
        },
        {
          "@type": "Question",
          "name": "Quando começam a contar os dias de licença?",
          "acceptedAnswer": { "@type": "Answer", "text": "A licença conta a partir do nascimento da criança. Os primeiros dias obrigatórios do pai são gozados logo após o nascimento e a licença da mãe inicia-se no parto." }
        },
        {
          "@type": "Question",
          "name": "Os dias de licença do pai são seguidos ou interpolados?",
          "acceptedAnswer": { "@type": "Answer", "text": "Os primeiros 7 dias são gozados de forma seguida logo após o nascimento. Os restantes 21 dias obrigatórios podem ser gozados seguidos ou interpolados, dentro das 6 semanas seguintes ao nascimento." }
        }
      ]
    }
    </script>
